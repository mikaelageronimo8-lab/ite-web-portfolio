<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="style.css">

        <style>
            body{
                text-align: center;
                margin-top: 75px;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background-color: rgb(220, 235, 250);
            }
            button{
                background-color: pink;
                color: white;
                border: none;
                padding: 20px;
                border-radius: 5px 20px;
            }

            button:hover{
                transform: translateY(5px);
                size: 50px;
                background-color: rgb(245, 118, 139);
            }
            #message{
                font-weight: bold;
                font-size: 24px;
            }

            h1:hover {
                color: rgb(95, 50, 57);
                font-style: italic;
            }
            p:hover{
               color: rgb(113, 115, 117);
            }



        </style>
<body>
    <h1>Annyeonghaseyo!</h1>

    <button id="loadBtn">

    </button>

    <button id="loadBtn2">
        Button 2
    </button>

    <p id="message">Waiting..</p>

    <p id="profile">Profile</p>
    <p id="grades">Grades</p>
    <p id="schedules">Schedules</p>

    <script src="script.js"></script>

</html>
